<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReliableSocials</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-slate-800">

  <!-- Navbar -->
  <header class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-7 flex items-center justify-between">
    <div class="flex items-center gap-2 text-blue-600 font-extrabold text-xl">
      <div class="w-7 h-7 rounded-lg bg-blue-600 text-white grid place-items-center text-sm">
        ↗
      </div>
      <span>ReliableSocials</span>
    </div>

    <nav class="hidden lg:flex items-center gap-8 text-sm font-semibold text-slate-400">
      <a href="#" class="hover:text-blue-600">Home</a>
      <a href="#" class="hover:text-blue-600">About Us</a>
      <a href="#" class="hover:text-blue-600">Contact Us</a>
      <a href="#" class="hover:text-blue-600">Blogs</a>
      <a href="#" class="hover:text-blue-600">Web API Documentation</a>
      <a href="#" class="hover:text-blue-600">Status</a>
      <a href="#" class="hover:text-blue-600">Register</a>
    </nav>

    <a href="#" class="login-btn bg-blue-600 text-white px-7 py-4 rounded-xl font-bold hover:bg-blue-700">
      Login
    </a>
  </header>

  <!-- Hero Section -->
  <section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 lg:py-16 grid lg:grid-cols-2 items-center gap-12 min-h-[720px]">

    <!-- Left Content -->
    <div>
      <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 grid place-items-center text-2xl mb-6">
        📶
      </div>

      <h3 class="text-3xl font-extrabold text-slate-900 mb-3">
        Buy <span class="text-blue-600">Data</span>
      </h3>

      <p class="text-lg text-slate-600 mb-10">
        Stay Connected with Cheap Data.
      </p>

      <p class="text-blue-600 font-bold text-lg mb-8">
        Personal & Business boost with ReliableSocials
      </p>

      <h1 class="text-[46px] sm:text-[60px] lg:text-[78px] leading-[1.08] tracking-[-3px] lg:tracking-[-5px] font-extrabold text-slate-700 mb-14">
        <span class="text-blue-600">Grow Faster,</span><br>
        Spend Less.<br>
        Use ReliableSocials!
      </h1>

      <div class="flex flex-col sm:flex-row gap-5">
        <a href="#" class="primary-btn bg-blue-600 text-white px-9 py-5 rounded-xl font-extrabold text-center hover:bg-blue-700">
          Register →
        </a>

        <a href="#" class="secondary-btn bg-slate-100 text-slate-400 px-9 py-5 rounded-xl font-extrabold text-center hover:bg-slate-200">
          Download App
        </a>
      </div>
    </div>

    <!-- Right Image Design -->
    <div class="relative flex justify-center items-center">
      <div class="relative w-[340px] sm:w-[500px] h-[450px] sm:h-[560px]">

        <!-- Phone -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[240px] sm:w-[300px] h-[380px] sm:h-[470px] bg-gradient-to-br from-blue-500 to-blue-800 rounded-[42px] p-5 rotate-[-3deg] shadow-2xl shadow-blue-200">
          <div class="relative w-full h-full rounded-[30px] overflow-hidden bg-gradient-to-br from-orange-100 via-rose-300 to-orange-200">

            <div class="absolute -left-8 top-28 w-14 h-14 rounded-2xl bg-red-500 text-white grid place-items-center text-3xl font-bold shadow-xl">
              ◎
            </div>

            <div class="absolute left-20 top-40 w-14 h-14 rounded-2xl bg-sky-400 text-white grid place-items-center text-2xl font-bold shadow-xl">
              𝕏
            </div>

            <div class="absolute right-8 top-32 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-blue-600 text-white grid place-items-center text-4xl shadow-xl">
              👍
            </div>

            <div class="absolute right-6 bottom-28 w-16 h-16 rounded-2xl bg-pink-500 text-white grid place-items-center text-3xl shadow-xl">
              ❤
            </div>

            <div class="absolute left-12 bottom-24 w-16 h-16 rounded-2xl bg-pink-100 text-slate-900 grid place-items-center text-4xl shadow-xl">
              ⌣
            </div>

          </div>
        </div>

        <!-- Floating Icons -->
        <div class="absolute top-10 left-36 text-5xl">
          ❤
        </div>

        <div class="absolute top-28 left-16 text-4xl">
          💗
        </div>

        <div class="absolute top-2 right-4 w-20 h-20 rounded-full bg-white text-blue-600 grid place-items-center text-3xl font-black shadow-xl">
          $
        </div>

        <div class="absolute top-28 right-20 w-20 h-20 rounded-full bg-orange-400 text-slate-900 grid place-items-center text-3xl font-black shadow-xl">
          ▶
        </div>

      </div>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
